<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wholesale Guide - BizGuide AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            BizGuide <span>AI</span>
        </div>

        <a href="dashboard.html" class="login-btn">
            Dashboard
        </a>

    </nav>


    <section class="tool-page">

        <h1>📦 Wholesale Guide</h1>

        <p>
            Find product sourcing ideas and wholesale guidance.
        </p>


        <div class="wholesale-box">

            <label>Select Product Category</label>

            <select id="category">

                <option value="">
                    -- Select Category --
                </option>

                <option value="hair">
                    Hair Accessories
                </option>

                <option value="bracelet">
                    Bracelets
                </option>

                <option value="gift">
                    Gift Items
                </option>

                <option value="stationery">
                    Stationery
                </option>

                <option value="beauty">
                    Beauty Accessories
                </option>

                <option value="toys">
                    Toys & Mini Gifts
                </option>

            </select>


            <button onclick="showWholesale()">
                Find Wholesale Guide
            </button>


            <div id="wholesaleResult"></div>

        </div>

    </section>


    <script src="wholesale.js"></script>

</body>

</html>
