<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Login - BizGuide AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">
                BizGuide <span>AI</span>
            </div>

            <h1>Business Owner Login</h1>

            <p class="login-description">
                Login to access your private business dashboard.
            </p>


            <form onsubmit="loginUser(event)">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="register-text">
                New business owner?
                <button onclick="window.location.href='register.html'">
    Create Account
</button>
</button> ">
                    Create Account
                </a>
            </p>


            <a href="login.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
